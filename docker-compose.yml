---
services:
  app:
    container_name: timatic_api_webserver
    build:
      context: './'
    image: "timatic-api:${APP_VERSION}"
    restart: unless-stopped
    ports:
      - ${APP_PORT:-8443}:443
    volumes:
      - ./:/app
  mysql:
    image: mysql:8.0.34
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysqldata:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: "secret"
      MYSQL_DATABASE: 'timatic'
      MYSQL_USER: 'timatic'
      MYSQL_PASSWORD: 'timatic'
    restart: unless-stopped
    ports:
      - ${DB_PORT_EXTERNAL:-3306}:3306
  test-mysql:
    image: mysql:8.0.34
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: "secret"
      MYSQL_DATABASE: 'timatic'
      MYSQL_USER: 'timatic'
      MYSQL_PASSWORD: 'timatic'
    restart: unless-stopped
  redis:
    image: redis:latest
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - ${MAILPIT_PORT:-8025}:8025
    restart: unless-stopped

volumes:
  mysqldata:
  caddy_data:
  caddy_config:
