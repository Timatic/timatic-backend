name: Export API Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'routes/**'
      - 'config/scramble.php'

permissions:
  contents: write

jobs:
  export-docs:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:7.0
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      # Scramble Pro (paid) is only needed to generate the spec; `composer docs:api` installs it temporarily
      - name: Configure Scramble Pro credentials
        run: composer config -g http-basic.satis.dedoc.co "${{ secrets.SCRAMBLE_USERNAME }}" "${{ secrets.SCRAMBLE_PASSWORD }}"

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Export API documentation
        run: composer docs:api

      - name: Commit API documentation
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update generated API documentation [skip ci]"
          skip_fetch: true
          file_pattern: 'public/api.json'
